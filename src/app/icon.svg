<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Browser tab icon. Next.js picks this up from app/icon.svg automatically.

    The F is drawn as three rectangles rather than set in a typeface: favicons
    render at 16x16, where hinting and font availability are both unreliable,
    and rectangles stay crisp at any size on any machine.
  -->
  <rect width="64" height="64" rx="14" fill="#2C3531"/>
  <g fill="#FFCB9A">
    <rect x="20" y="15" width="24" height="9" rx="1.5"/>
    <rect x="20" y="15" width="9"  height="34" rx="1.5"/>
    <rect x="20" y="31" width="18" height="9" rx="1.5"/>
  </g>
</svg>
